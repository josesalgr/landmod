name: Publish LANDMOD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Install editorial studio
        run: npm ci --ignore-scripts --prefix studio
      - name: Build editorial studio
        working-directory: studio
        run: node node_modules/sanity/bin/sanity build ../dist/editor --yes
        env:
          SANITY_STUDIO_PROJECT_ID: 8wkx4imp
          SANITY_STUDIO_DATASET: editorial-test
      - run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: landmod-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow GitHub artifact metadata to become available
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: landmod-pages-${{ github.run_id }}-${{ github.run_attempt }}
